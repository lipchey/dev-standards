name: Quality

on:
  pull_request:
  push:
    branches:
      - main

# CI runs are ephemeral noise for effectiveness telemetry; keep the sink off.
# Quoted: unquoted `off` is YAML boolean false, not the literal string the runner checks for.
env:
  DS_TELEMETRY_PATH: "off"

jobs:
  fast:
    name: Fast Verify
    runs-on: ubuntu-latest
    # Job-level ceiling around the whole run: the manifest's monotonic tier
    # deadline only bounds ./verify, not checkout/setup-node/bootstrap.
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Bootstrap
        run: npm run bootstrap
      - name: Verify Fast
        run: ./verify --fast

  full:
    name: Full Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Bootstrap
        run: npm run bootstrap
      - name: Verify Full
        run: ./verify --full
